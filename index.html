<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat et Souris - Le Jeu</title>
    <!-- Styles pour la carte Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: sans-serif; }
        #ecran-connexion { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #222; color: white; }
        input, select, button { padding: 12px; margin: 10px; font-size: 16px; border-radius: 8px; border: none; width: 80%; max-width: 300px; }
        button { background: #28a745; color: white; font-weight: bold; cursor: pointer; }
        #map { height: 100vh; width: 100vw; display: none; }
        #UI-statut { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; display: none; pointer-events: none; }
    </style>
</head>
<body>

    <!-- ÉCRAN DE CONNEXION (BLASE + RÔLE) -->
    <div id="ecran-connexion">
        <h2>Créer ton Joueur</h2>
        <input type="text" id="blase" placeholder="Entre ton Blase (Pseudo)" required>
        <select id="role">
            <option value="souris">🐭 Souris</option>
            <option value="chat">🐱 Chat</option>
        </select>
        <button onclick="rejoindrePartie()">Lancer le Jeu</button>
    </div>

    <!-- ZONE DE JEU (CARTE) -->
    <div id="UI-statut">Statut : Connexion...</div>
    <div id="map"></div>

    <!-- SCRIPTS -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const socket = io();
        let map, marqueurs = {}, cercleBuffer = null, centreInitialFait = false;

        function rejoindrePartie() {
            const blase = document.getElementById('blase').value;
            const role = document.getElementById('role').value;

            if(!blase) return alert("Mets un blase valide !");

            // Masquer la connexion, afficher la carte
            document.getElementById('ecran-connexion').style.display = 'none';
            document.getElementById('map').style.display = 'block';
            document.getElementById('UI-statut').style.display = 'block';

            // Initialiser la carte Leaflet (centrée par défaut, s'adaptera au GPS)
            map = L.map('map').setView([50.665, 4.225], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // 1. Envoyer le profil au serveur
            socket.emit('rejoindre_jeu', { blase, role });

            // 2. Activer la géolocalisation en continu sur le téléphone
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((position) => {
                    const mesCoords = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    // Centrer la carte sur soi une seule fois au premier fix GPS
                    // (sinon ça recentre à chaque update et ça empêche de zoomer/déplacer la carte librement)
                    if (!centreInitialFait) {
                        map.panTo([mesCoords.lat, mesCoords.lng]);
                        centreInitialFait = true;
                    }

                    // Envoyer les coordonnées en continu au serveur
                    socket.emit('mise_a_jour_position', mesCoords);
                }, (err) => console.error(err), { enableHighAccuracy: true });
            } else {
                alert("Le GPS n'est pas activé ou supporté.");
            }
        }

        // 3. Réceptionner les positions filtrées (par rôle, côté serveur) et dessiner le Buffer
        socket.on('maj_carte', (data) => {
            // Mettre à jour le texte du statut (Immunisé, En jeu, etc.)
            document.getElementById('UI-statut').innerText = `Statut : ${data.monStatut}`;

            // Dessiner ou mettre à jour le cercle de la Zone Tampon (Buffer) de 10 min
            // (arrivera à l'étape 5 - le serveur n'envoie pas encore zoneAttente, ce bloc ne fait donc rien pour l'instant)
            if (data.zoneAttente) {
                if (!cercleBuffer) {
                    cercleBuffer = L.circle([data.zoneAttente.lat, data.zoneAttente.lng], {
                        radius: data.zoneAttente.rayonMetres,
                        color: 'purple',
                        fillColor: '#a020f0',
                        fillOpacity: 0.2
                    }).addTo(map).bindPopup("Zone de Ravitaillement (10 mins d'attente max)");
                }
            }

            // Nettoyer les marqueurs des joueurs déconnectés (ou plus visibles pour mon rôle)
            const idsRecus = data.joueurs.map(j => j.id);
            Object.keys(marqueurs).forEach(id => {
                if (!idsRecus.includes(id)) {
                    map.removeLayer(marqueurs[id]);
                    delete marqueurs[id];
                }
            });

            // Placer/Déplacer les icônes sur la carte
            data.joueurs.forEach(joueur => {
                if (!joueur.lat || !joueur.lng) return;

                const iconeEmoji = joueur.role === 'chat' ? '🐱' : '🐭';
                const texteMarqueur = `<b>${joueur.blase}</b> (${joueur.role})`;

                if (marqueurs[joueur.id]) {
                    // Si le joueur existe déjà, on déplace son curseur
                    marqueurs[joueur.id].setLatLng([joueur.lat, joueur.lng]);
                } else {
                    // Sinon on crée un nouveau marqueur avec son Emoji
                    const iconePerso = L.divIcon({
                        html: `<span style="font-size: 24px;">${iconeEmoji}</span>`,
                        className: 'dummy'
                    });
                    marqueurs[joueur.id] = L.marker([joueur.lat, joueur.lng], { icon: iconePerso })
                        .addTo(map)
                        .bindPopup(texteMarqueur);
                }
            });
        });
    </script>
</body>
</html>
